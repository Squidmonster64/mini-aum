<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini AUM - Audio Mixer</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a7ea4">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #151718;
            color: #ECEDEE;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 100%; overflow-x: auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .mixer { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 20px; }
        .channel {
            flex-shrink: 0;
            width: 60px;
            background: #1e2022;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .channel.drums { border-left: 3px solid #EF4444; }
        .channel.bass { border-left: 3px solid #F59E0B; }
        .channel.guitar { border-left: 3px solid #22C55E; }
        .channel.vocals { border-left: 3px solid #3B82F6; }
        .channel.keys { border-left: 3px solid #A855F7; }
        .channel.strings { border-left: 3px solid #EC4899; }
        .channel-name { font-size: 12px; font-weight: 600; text-align: center; }
        .fader-container { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
        input[type="range"] { width: 100%; height: 120px; writing-mode: bt-lr; appearance: slider-vertical; }
        .controls { display: flex; gap: 4px; }
        button {
            flex: 1;
            padding: 6px;
            background: #0a7ea4;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        button.active { background: #22C55E; }
        .master { margin-top: 20px; background: #1e2022; border: 2px solid #0a7ea4; border-radius: 8px; padding: 16px; }
        .master-label { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
        .master-controls { display: flex; gap: 12px; }
        .master-fader { flex: 1; }
        .master-buttons { display: flex; gap: 8px; }
        .master-buttons button { flex: 1; padding: 12px; }
        .vu-meter { 
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .vu-bar { height: 100%; background: #22C55E; width: 75%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Mini AUM</h1>
        
        <div class="mixer">
            <div class="channel drums">
                <div class="channel-name">Drums</div>
                <div class="fader-container">
                    <input type="range" min="0" max="100" value="75" class="volume">
                </div>
                <div class="vu-meter"><div class="vu-bar" style="width: 75%;"></div></div>
                <div class="controls">
                    <button class="mute">M</button>
                    <button class="solo">S</button>
                </div>
            </div>

            <div class="channel bass">
                <div class="channel-name">Bass</div>
                <div class="fader-container">
                    <input type="range" min="0" max="100" value="70" class="volume">
                </div>
                <div class="vu-meter"><div class="vu-bar" style="width: 70%;"></div></div>
                <div class="controls">
                    <button class="mute">M</button>
                    <button class="solo">S</button>
                </div>
            </div>

            <div class="channel guitar">
                <div class="channel-name">Guitar</div>
                <div class="fader-container">
                    <input type="range" min="0" max="100" value="60" class="volume">
                </div>
                <div class="vu-meter"><div class="vu-bar" style="width: 60%;"></div></div>
                <div class="controls">
                    <button class="mute">M</button>
                    <button class="solo">S</button>
                </div>
            </div>

            <div class="channel vocals">
                <div class="channel-name">Vocals</div>
                <div class="fader-container">
                    <input type="range" min="0" max="100" value="80" class="volume">
                </div>
                <div class="vu-meter"><div class="vu-bar" style="width: 80%;"></div></div>
                <div class="controls">
                    <button class="mute">M</button>
                    <button class="solo">S</button>
                </div>
            </div>

            <div class="channel keys">
                <div class="channel-name">Keys</div>
                <div class="fader-container">
                    <input type="range" min="0" max="100" value="65" class="volume">
                </div>
                <div class="vu-meter"><div class="vu-bar" style="width: 65%;"></div></div>
                <div class="controls">
                    <button class="mute">M</button>
                    <button class="solo">S</button>
                </div>
            </div>

            <div class="channel strings">
                <div class="channel-name">Strings</div>
                <div class="fader-container">
                    <input type="range" min="0" max="100" value="55" class="volume">
                </div>
                <div class="vu-meter"><div class="vu-bar" style="width: 55%;"></div></div>
                <div class="controls">
                    <button class="mute">M</button>
                    <button class="solo">S</button>
                </div>
            </div>
        </div>

        <div class="master">
            <div class="master-label">Master</div>
            <div class="master-controls">
                <div class="master-fader">
                    <input type="range" min="0" max="100" value="80" class="volume" style="width: 100%; height: 30px;">
                    <div class="vu-meter"><div class="vu-bar" style="width: 80%;"></div></div>
                </div>
            </div>
            <div class="master-buttons" style="margin-top: 12px;">
                <button id="play">▶ Play</button>
                <button id="stop">⏹ Stop</button>
            </div>
        </div>
    </div>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }

        // Fader interactions
        document.querySelectorAll('input[type="range"]').forEach(fader => {
            fader.addEventListener('input', (e) => {
                const value = e.target.value;
                const meter = e.target.closest('.channel, .master-fader').querySelector('.vu-bar');
                if (meter) meter.style.width = value + '%';
            });
        });

        // Mute/Solo buttons
        document.querySelectorAll('.mute, .solo').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
            });
        });

        // Play/Stop
        document.getElementById('play').addEventListener('click', () => {
            alert('▶ Playback started!');
        });
        document.getElementById('stop').addEventListener('click', () => {
            alert('⏹ Playback stopped!');
        });
    </script>
</body>
</html>
